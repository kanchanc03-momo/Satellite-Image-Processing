<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>EarthVision — Processing History</title>
  
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "background": "#0a0e15",
            "surface-panel": "#0f131b",
            "surface-elevated": "#151a23",
            "surface-border": "rgba(255, 255, 255, 0.08)",
            "primary": "#4cd7f6",
            "primary-container": "#06b6d4",
            "accent": "#4da3ff",
            "tertiary": "#4edea3"
          },
          fontFamily: {
            sans: ["Inter", "sans-serif"],
            mono: ["JetBrains Mono", "monospace"]
          }
        }
      }
    };
  </script>
</head>
<body class="bg-background text-white/90 antialiased min-h-screen flex flex-col selection:bg-primary-container font-sans">

  <!-- TOP HEADER -->
  <header class="h-14 bg-surface-panel border-b border-surface-border px-4 flex items-center justify-between z-30 flex-shrink-0">
    <div class="flex items-center gap-4">
      <a href="explorer.html" class="flex items-center gap-2 hover:opacity-80 transition-opacity">
        <svg class="h-7 w-7 text-primary" viewBox="0 0 32 32" fill="none">
          <circle cx="16" cy="16" r="14" stroke="#4cd7f6" stroke-width="2" stroke-opacity="0.4"/>
          <ellipse cx="16" cy="16" rx="14" ry="5.5" stroke="#4edea3" stroke-width="1.8" transform="rotate(-25 16 16)"/>
          <circle cx="16" cy="16" r="8" fill="#090e1c" stroke="#4cd7f6" stroke-width="2"/>
          <circle cx="16" cy="16" r="4" fill="#4cd7f6"/>
        </svg>
        <span class="font-semibold text-sm tracking-tight text-white">EarthVision</span>
      </a>
      <div class="h-4 w-px bg-white/10"></div>
      <div class="flex items-center gap-2 text-xs">
        <span class="text-white/40">DIP Audit Log</span>
        <span class="text-white/20">/</span>
        <span class="text-white font-medium">Processing History</span>
      </div>
    </div>
    <button onclick="clearAllHistory()" class="px-3 py-1.5 rounded-lg bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 text-xs font-semibold flex items-center gap-1.5 transition-colors">
      <span class="material-symbols-outlined text-[16px]">delete_sweep</span>
      <span>Clear All History</span>
    </button>
  </header>

  <div class="flex-1 flex overflow-hidden">
    <!-- 56px Sidebar -->
    <aside class="w-14 bg-[#0A0E15] border-r border-surface-border flex flex-col items-center py-3 gap-2 shrink-0 select-none z-20">
      <a href="index.html" class="w-10 h-10 rounded-lg flex items-center justify-center text-white/40 hover:text-white hover:bg-white/[0.06] transition-colors" title="Landing Page">
        <span class="material-symbols-outlined text-[20px]">home</span>
      </a>
      <a href="explorer.html" class="w-10 h-10 rounded-lg flex items-center justify-center text-white/40 hover:text-white hover:bg-white/[0.06] transition-colors" title="3D Earth Explorer">
        <span class="material-symbols-outlined text-[20px]">public</span>
      </a>
      <a href="workspace.html" class="w-10 h-10 rounded-lg flex items-center justify-center text-white/40 hover:text-white hover:bg-white/[0.06] transition-colors" title="DIP Workspace">
        <span class="material-symbols-outlined text-[20px]">tune</span>
      </a>
      <a href="catalog.html" class="w-10 h-10 rounded-lg flex items-center justify-center text-white/40 hover:text-white hover:bg-white/[0.06] transition-colors" title="Scene Catalog">
        <span class="material-symbols-outlined text-[20px]">photo_library</span>
      </a>
      <a href="history.html" class="w-10 h-10 rounded-lg flex items-center justify-center text-primary bg-primary/10 border border-primary/30 transition-colors" title="Processing History">
        <span class="material-symbols-outlined text-[20px]">history</span>
      </a>
      <div class="mt-auto">
        <a href="settings.html" class="w-10 h-10 rounded-lg flex items-center justify-center text-white/40 hover:text-white hover:bg-white/[0.06] transition-colors" title="Settings">
          <span class="material-symbols-outlined text-[20px]">settings</span>
        </a>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto p-6 max-w-6xl mx-auto w-full space-y-6">
      
      <!-- Filter Bar: Search, Sort, Filter by Algorithm -->
      <div class="bg-surface-elevated p-4 rounded-xl border border-surface-border flex flex-wrap items-center justify-between gap-4">
        <div class="flex items-center gap-2 bg-surface-panel px-3 py-1.5 rounded-lg border border-white/5 flex-1 min-w-[200px]">
          <span class="material-symbols-outlined text-white/40 text-[18px]">search</span>
          <input type="text" id="histSearch" placeholder="Search by location, coordinates or algorithm..." 
            class="bg-transparent text-xs text-white placeholder-white/40 outline-none w-full"/>
        </div>

        <div class="flex items-center gap-3">
          <div class="flex items-center gap-1.5 text-xs text-white/60">
            <span>Filter:</span>
            <select id="histFilterAlgo" class="bg-surface-panel border border-white/10 rounded px-2.5 py-1.5 text-white outline-none">
              <option value="all">All Algorithms</option>
              <option value="brightness">Brightness</option>
              <option value="contrast">Contrast</option>
              <option value="gamma">Gamma</option>
              <option value="hist_eq">Histogram Eq</option>
              <option value="clahe">CLAHE</option>
              <option value="contrast_stretch">Contrast Stretch</option>
              <option value="gaussian">Gaussian</option>
              <option value="median">Median</option>
              <option value="mean">Mean</option>
              <option value="sharpen">Sharpen</option>
              <option value="kmeans">K-Means</option>
              <option value="gray_threshold">Threshold</option>
              <option value="sobel">Sobel</option>
              <option value="canny">Canny</option>
              <option value="vegetation_proxy">Vegetation Proxy</option>
            </select>
          </div>

          <div class="flex items-center gap-1.5 text-xs text-white/60">
            <span>Sort:</span>
            <select id="histSort" class="bg-surface-panel border border-white/10 rounded px-2.5 py-1.5 text-white outline-none">
              <option value="newest">Newest First</option>
              <option value="oldest">Oldest First</option>
              <option value="location">Location (A-Z)</option>
              <option value="algorithm">Algorithm (A-Z)</option>
            </select>
          </div>
        </div>
      </div>

      <!-- History List -->
      <div id="historyList" class="space-y-3">
        <!-- Rendered dynamically -->
      </div>

      <!-- Empty State -->
      <div id="historyEmpty" class="hidden py-20 flex flex-col items-center justify-center text-center gap-3 border border-dashed border-white/10 rounded-2xl">
        <span class="material-symbols-outlined text-4xl text-white/20">history</span>
        <div class="text-sm font-semibold text-white/80">No processing history recorded</div>
        <p class="text-xs text-white/40 max-w-sm">Run algorithms in the DIP Studio to log execution metrics and parameters.</p>
        <a href="workspace.html" class="mt-2 px-4 py-2 bg-primary-container text-[#002b36] rounded-lg text-xs font-semibold hover:bg-primary transition-all">Go to DIP Studio &rarr;</a>
      </div>

    </main>
  </div>

  <script src="js/state.js?v=2.6.0"></script>
  <script>
    let allHistory = [];

    document.addEventListener('DOMContentLoaded', () => {
      allHistory = window.EarthVisionState.getHistory();
      renderHistory();

      document.getElementById('histSearch').addEventListener('input', renderHistory);
      document.getElementById('histFilterAlgo').addEventListener('change', renderHistory);
      document.getElementById('histSort').addEventListener('change', renderHistory);
    });

    function renderHistory() {
      const search = document.getElementById('histSearch').value.toLowerCase();
      const filterAlgo = document.getElementById('histFilterAlgo').value;
      const sortMode = document.getElementById('histSort').value;

      let list = allHistory.filter(item => {
        const matchesSearch = (item.location || '').toLowerCase().includes(search) ||
                              (item.algorithm || '').toLowerCase().includes(search) ||
                              (item.coordinates || '').toLowerCase().includes(search);
        const matchesAlgo = filterAlgo === 'all' || item.algorithm === filterAlgo;
        return matchesSearch && matchesAlgo;
      });

      list.sort((a, b) => {
        if (sortMode === 'newest') return new Date(b.timestamp) - new Date(a.timestamp);
        if (sortMode === 'oldest') return new Date(a.timestamp) - new Date(b.timestamp);
        if (sortMode === 'location') return (a.location || '').localeCompare(b.location || '');
        if (sortMode === 'algorithm') return (a.algorithm || '').localeCompare(b.algorithm || '');
        return 0;
      });

      const container = document.getElementById('historyList');
      const empty = document.getElementById('historyEmpty');

      if (list.length === 0) {
        container.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }

      empty.classList.add('hidden');
      container.innerHTML = list.map(item => `
        <div class="bg-surface-elevated p-4 rounded-xl border border-surface-border flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 hover:border-primary/40 transition-colors">
          <div class="flex items-center gap-4">
            ${item.thumbnail ? `
              <div class="w-20 h-16 rounded overflow-hidden bg-black border border-white/10 shrink-0">
                <img src="${item.thumbnail}" class="w-full h-full object-cover" onerror="this.parentElement.innerHTML='<div class=\\'w-full h-full bg-primary/10 flex flex-col items-center justify-center text-primary\\'><span class=\\'material-symbols-outlined text-[20px]\\'>tune</span><span class=\\'text-[9px] font-mono mt-0.5 uppercase\\'>DIP</span></div>';" />
              </div>
            ` : `
              <div class="w-20 h-16 rounded bg-primary/10 border border-primary/20 flex flex-col items-center justify-center text-primary shrink-0">
                <span class="material-symbols-outlined text-[20px]">tune</span>
                <span class="text-[9px] font-mono mt-0.5 uppercase tracking-wider">${(item.algorithm || 'DIP').slice(0, 8)}</span>
              </div>
            `}
            <div class="space-y-1">
              <div class="flex items-center gap-2">
                <span class="font-semibold text-sm text-white capitalize">${(item.algorithm || 'Processing').replace(/_/g, ' ')}</span>
                <span class="text-[10px] font-mono bg-primary/10 text-primary px-1.5 py-0.5 rounded border border-primary/20">${item.time_ms || 0} ms</span>
              </div>
              <div class="text-xs text-white/70">${item.location || 'Selected Area'} <span class="font-mono text-white/40">(${item.coordinates || 'Custom AOI'})</span></div>
              <div class="text-[11px] font-mono text-white/40">${item.timestamp ? new Date(item.timestamp).toLocaleString() : ''}</div>
            </div>
          </div>

          <div class="flex items-center gap-2 self-end sm:self-center">
            <button onclick="reopenItem('${item.id}')" class="px-3 py-1.5 bg-primary-container text-[#002b36] hover:bg-primary rounded text-xs font-semibold flex items-center gap-1 transition-colors cursor-pointer">
              <span class="material-symbols-outlined text-[15px]">open_in_new</span>
              <span>Reopen</span>
            </button>
            <button onclick="deleteItem('${item.id}')" class="p-1.5 text-white/40 hover:text-red-400 rounded transition-colors cursor-pointer" title="Delete record">
              <span class="material-symbols-outlined text-[16px]">delete</span>
            </button>
          </div>
        </div>
      `).join('');
    }

    function reopenItem(id) {
      const item = allHistory.find(h => h.id === id);
      if (item) {
        if (item.coordinates && item.coordinates !== 'N/A') {
          const parts = item.coordinates.replace(/[^\d.,-]/g, '').split(',');
          if (parts.length === 2 && !isNaN(parseFloat(parts[0])) && !isNaN(parseFloat(parts[1]))) {
            window.location.href = `workspace.html?lat=${parseFloat(parts[0]).toFixed(4)}&lon=${parseFloat(parts[1]).toFixed(4)}`;
            return;
          }
        }
        window.location.href = 'workspace.html';
      }
    }

    function deleteItem(id) {
      window.EarthVisionState.deleteHistoryItem(id);
      allHistory = window.EarthVisionState.getHistory();
      renderHistory();
    }

    function clearAllHistory() {
      if (confirm('Clear all processing history?')) {
        window.EarthVisionState.clearHistory();
        allHistory = [];
        renderHistory();
      }
    }
  </script>
</body>
</html>
